name: Test GITHUB_TOKEN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test GITHUB_TOKEN
        run: |
          echo "Testing GITHUB_TOKEN..."
          gh repo view
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
