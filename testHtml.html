<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Sample Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #0078d7;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        main {
            padding: 20px;
        }

        article {
            background: white;
            padding: 15px;
            border-radius: 5px;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to HTML5</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <article>
            <h2>Sample Article</h2>
            <p>This page uses HTML5 semantic elements like <code>header</code>, <code>nav</code>, <code>main</code>, <code>article</code>, and <code>footer</code>.</p>

<script src="https://gist.github.com/randeer/616d8babd52680ee5a52b5e278af4195.js"></script>

<p>Linux Code<p>
<script src="https://gist.github.com/randeer/926297962cb550f6c952b785e3b65d23.js"></script>

            <button onclick="showMessage()">Click Me</button>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            alert("Hello from HTML5 and JavaScript!");
        }
    </script>

</body>
</html>
